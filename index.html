<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireBite Kitchen - Owner Dashboard</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--surf:#111a2c;--surf2:#172338;--line:#22314a;--tx:#e6edf7;--muted:#93a4bd;--brand:#0EA5E9;--brand2:#7DD3FC;--good:#22C55E;--bad:#EF4444;--warn:#F59E0B;--r:14px}
[data-theme=light]{--bg:#f1f5f9;--surf:#fff;--surf2:#e8eff7;--line:#d9e2ec;--tx:#0f1b2d;--muted:#5b6b82;--brand2:#0369A1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 400px at 85% -10%,rgba(14,165,233,.18),transparent),var(--bg)}
.side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 22px}.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px}.brand small{color:var(--muted);font-size:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0EA5E9,#14B8A6);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 20px rgba(14,165,233,.45)}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:2px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;transition:background .15s,color .15s}
.nav a i{font-size:17px}.nav a:hover{background:var(--surf2);color:var(--tx)}.nav a.on{background:rgba(14,165,233,.16);color:var(--brand2);box-shadow:inset 3px 0 0 var(--brand)}
.sfoot{margin-top:auto;padding:10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column}
.main{margin-left:260px;min-height:100vh}.top{display:flex;align-items:center;gap:12px;padding:18px 32px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:800;margin:0;flex:1;letter-spacing:-.4px}.ib{display:none;width:42px;height:42px;padding:0;place-items:center}.top .ib:last-child{display:grid}
.view{padding:24px 32px 60px;max-width:1680px}
.btn{border-radius:10px;font-weight:600;font-size:14px}.btn-primary{background:var(--brand);border-color:var(--brand)}.btn-primary:hover{background:#0369A1;border-color:#0369A1}
.btn-ghost{background:var(--surf);border:1px solid var(--line);color:var(--tx)}.btn-ghost:hover{background:var(--surf2);color:var(--tx);border-color:var(--brand)}.btn-lg{padding:12px 20px;font-size:15px}
.fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}.fsel{min-width:170px}.fsel.two{display:flex;gap:8px}.fsel label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.form-select,.form-control{background-color:var(--surf);border:1px solid var(--line);color:var(--tx);border-radius:10px;font-weight:500}.form-select:focus,.form-control:focus{background-color:var(--surf);color:var(--tx);border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,165,233,.25)}
[data-theme=dark] .form-select{--bs-form-select-bg-img:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ccc' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e")}
[data-theme=dark] ::-webkit-calendar-picker-indicator{filter:invert(.8)}
.ctx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;padding:14px 18px;background:linear-gradient(90deg,rgba(14,165,233,.16),transparent);border:1px solid var(--line);border-radius:var(--r)}
.pill{display:inline-block;padding:5px 14px;border-radius:99px;background:var(--brand);color:#fff;font-weight:700;margin-right:8px}.pill.alt{background:var(--surf2);color:var(--tx);border:1px solid var(--line)}
.dates{font-weight:700;font-size:16px;text-align:right}.dates small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.grid.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:22px}.grid.k.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;transition:transform .2s,border-color .2s}.kc:hover{transform:translateY(-2px);border-color:var(--brand)}
.kc.brand{background:linear-gradient(145deg,rgba(14,165,233,.3),var(--surf))}.kc.good{border-color:rgba(34,197,94,.5)}.kc.good .kv{color:var(--good)}.kc.bad{border-color:rgba(239,68,68,.5)}.kc.bad .kv{color:var(--bad)}
.kl{color:var(--muted);font-weight:600;font-size:13px}.kv{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:4px 0;line-height:1.15;font-variant-numeric:tabular-nums}.kv.na{font-size:18px;color:var(--muted);font-weight:600;padding:5px 0}
.ks{color:var(--muted);font-size:13px;min-height:38px}.cmp{font-size:12.5px;font-weight:700;margin-top:8px}.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted);font-weight:500}.tip{cursor:help;margin-left:3px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ph h3{font-size:17px;font-weight:700;margin:0}.big{font-size:22px}
.chartbox{height:320px}.note{padding:12px 16px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);margin-bottom:16px;font-size:14px}
.tw{overflow-x:auto}.rt{width:100%;border-collapse:collapse;font-size:14px}.rt th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.rt td{padding:10px 12px;border-bottom:1px solid var(--line)}.rt .n,.rt th:not(:first-child){text-align:right}.rt tr:hover td{background:var(--surf2)}.rt td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rt tr.od td{background:rgba(239,68,68,.12)}.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.tag.g{background:rgba(34,197,94,.15);color:var(--good)}.tag.r{background:rgba(239,68,68,.15);color:var(--bad)}.tag.y{background:rgba(245,158,11,.15);color:var(--warn)}
.bar{display:grid;grid-template-columns:150px 1fr 130px;gap:12px;align-items:center;padding:6px 0}.bar div{height:10px;background:var(--surf2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0EA5E9,#38BDF8);border-radius:9px}.bar b{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surf2);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px}.seg .on{background:var(--brand);color:#fff}
.eq{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 14px}.eq div{background:var(--surf2);border-radius:12px;padding:12px 20px}.eq small{display:block;color:var(--muted)}.eq b{font-size:24px}.eq span{font-size:26px;color:var(--muted)}.eq .g b{color:var(--good)}
.hero,.empty{text-align:center;padding:70px 20px}.hero h1{font-weight:800;letter-spacing:-1px}.hero p{color:var(--muted);max-width:480px;margin:10px auto 24px}.empty{padding:30px;color:var(--muted)}.empty i{font-size:34px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 16px;border:2px dashed var(--line);border-radius:var(--r);cursor:pointer;text-align:center;transition:.2s}.drop:hover{border-color:var(--brand);background:rgba(14,165,233,.07)}.drop i{font-size:38px;color:var(--brand2)}.drop span{color:var(--muted);font-size:13px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}.meta small{display:block;color:var(--muted)}.chip{display:inline-block;background:var(--surf2);border-radius:99px;padding:4px 12px;margin:0 6px 6px 0;font-size:13px}
.msg{padding:9px 14px;border-radius:10px;margin-top:8px;font-size:14px}.msg.r{background:rgba(239,68,68,.12);color:var(--bad)}.msg.y{background:rgba(245,158,11,.12);color:var(--warn)}.msg.g{background:rgba(34,197,94,.12);color:var(--good)}.pv.bad{border-color:rgba(239,68,68,.5)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}.modes label{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:block}.modes label.on{border-color:var(--brand);background:rgba(14,165,233,.1)}.modes span{display:block;color:var(--muted);font-size:13px}.modes input{margin-right:8px}
.gl dt{font-weight:700;margin-top:10px}.gl dd{color:var(--muted);margin:0}
/* report paper + save box */
.paper{background:#fff;color:#0f1b2d;border-radius:var(--r);padding:34px;margin-bottom:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.paper .rt td,.paper .rt th{border-color:#e5e5ef}.paper .rt tr:hover td{background:none}.paper .rt th{color:#555}
.rh{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0EA5E9;padding-bottom:12px;margin-bottom:16px}.rb{color:#0EA5E9;font-weight:800}.rh h2{margin:0;font-size:24px;font-weight:800}.rm{color:#555;font-size:13px}
.rk{background:#e8f6fd;border-left:6px solid #0EA5E9;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}.rk b{font-size:28px}.rk.pos b{color:#15803d}.rk.neg b{color:#b91c1c}.rk span,.rk small{color:#555}
.paper h3{font-size:16px;font-weight:700;color:#075985;margin:20px 0 8px;break-after:avoid}.paper .small{font-size:12.5px;color:#444}.paper .neg{color:#b91c1c}
.save{background:linear-gradient(135deg,#0EA5E9,#075985);color:#fff;border-radius:var(--r);padding:28px;text-align:center}.save h2{font-weight:800}.save p{opacity:.9}.save .sb{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}.save .btn-primary{background:#fff;color:#075985;border-color:#fff}.save .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}.save code{background:rgba(0,0,0,.25);padding:2px 8px;border-radius:6px;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:92vw;border-left:5px solid var(--good);box-shadow:0 10px 30px rgba(0,0,0,.4)}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--bad)}
.scrim{display:none}
@media(max-width:991px){.side{transform:translateX(-100%)}.menu .side{transform:none;box-shadow:0 0 60px #000}.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}.main{margin-left:0}.ib{display:grid}.top{padding:12px 16px}.view{padding:16px 14px 50px}.top h1{font-size:18px}.bar{grid-template-columns:1fr 1fr}.bar div{grid-column:1/-1;order:3}.paper{padding:18px}.kv{font-size:24px}.dates{text-align:left}.fsel{min-width:46%;flex:1}}
.cg{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-bottom:6px}.cg>.panel{margin:0}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.cb{position:relative;height:290px}.spw{position:relative;height:38px;margin-top:8px}
.ins{list-style:none;margin:0;padding:0}.ins li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.ins li:last-child{border:0}.ins i{color:var(--warn)}.mt{margin-bottom:16px}.mt>div:first-child{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mt span{color:var(--muted);font-weight:600}.mb{height:10px;background:var(--surf2);border-radius:9px;overflow:hidden;margin:6px 0 3px}.mb i{display:block;height:100%;background:var(--brand);border-radius:9px}.mb i.ok{background:var(--good)}
@media(max-width:1100px){.c4,.c6,.c8{grid-column:span 12}}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:30px 0 12px;display:flex;align-items:center;gap:12px}.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.lnk{cursor:pointer}.mtab tfoot td{font-weight:800;border-top:2px solid var(--brand);background:var(--surf2);padding:12px}.mtab tr.pick{cursor:pointer}.mtab tr.sel td{background:rgba(14,165,233,.16)}.scr{max-height:330px;overflow:auto}.rt th{position:sticky;top:0;background:var(--surf)}
.c12{grid-column:span 12}.rt{min-width:520px}.rt th,.rt td{padding:11px 16px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:6px}.ring{text-align:center;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px}.ring svg{width:118px;height:118px}.ring b{display:block;margin-top:4px}.ring small{display:block;color:var(--muted);font-size:12.5px}
.r0{fill:none;stroke:var(--surf2);stroke-width:10}.r1{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .9s ease}.rx{fill:var(--tx);font-weight:800;font-size:17px}
.flow{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:2px;margin:8px 0 18px}.flow i{display:block;height:100%;min-width:2px}.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px 26px}.leg div{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center}.leg small{color:var(--muted);min-width:110px;text-align:right}.dot{width:12px;height:12px;border-radius:4px}
.bar2{display:grid;grid-template-columns:250px 1fr 120px 70px;gap:14px;align-items:center;padding:8px 0}.bar2>div{height:14px;background:var(--surf2);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;border-radius:9px}.bar2 b{text-align:right}.bar2 em{color:var(--muted);font-style:normal;text-align:right}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 12px}.pst div{background:#e8f6fd;border-radius:10px;padding:14px;text-align:center}.pst small{display:block;color:#555}.pst b{font-size:22px}.pst .g b{color:#15803d}.pst .r b{color:#b91c1c}
#chatBtn{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;gap:10px;align-items:center;border:0;border-radius:99px;padding:14px 22px;background:linear-gradient(135deg,#0EA5E9,#14B8A6);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(14,165,233,.45);transition:transform .2s}#chatBtn:hover{transform:translateY(-2px)}#chatBtn i{font-size:19px}
#chat{position:fixed;right:22px;bottom:84px;width:390px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 110px);background:var(--surf);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:60;display:none;flex-direction:column;overflow:hidden}#chat.open{display:flex}
.chh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,rgba(14,165,233,.25),transparent);border-bottom:1px solid var(--line)}.chh small{display:block;color:var(--muted);font-size:11.5px}.chh button{background:none;border:0;color:var(--tx);font-size:18px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.m{padding:10px 14px;border-radius:14px;max-width:92%;font-size:14px;line-height:1.5}.m.b{background:var(--surf2);align-self:flex-start;border-bottom-left-radius:4px}.m.u{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.bt{margin-top:6px;font-size:11.5px;color:var(--muted)}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}#chips button{background:var(--surf2);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:12.5px}#chips button:hover{border-color:var(--brand)}
.chf{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chf input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;outline:0}.chf input:focus{border-color:var(--brand)}.chf button{border:0;border-radius:10px;background:var(--brand);color:#fff;width:44px}
@media(max-width:991px){.bar2{grid-template-columns:1fr 1fr}.bar2>div{grid-column:1/-1;order:3}.pst{grid-template-columns:1fr}#chat{right:8px;bottom:78px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff}.side,.top,.scrim,.fbar,.note,.save,#toast,.panel,.hero,#chat,#chatBtn{display:none!important}.main{margin:0}.view{padding:0;max-width:none}.paper{box-shadow:none;border-radius:0;padding:0;margin:0}.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rt tr,.rk{break-inside:avoid}.tw{overflow:visible}@page{margin:14mm}}

</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo"><i class="bi bi-fire"></i></span><div><b>FireBite</b><small>Owner Dashboard</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sfoot"><span id="last">No data loaded</span><small>Fictional demo data</small></div>
</aside>
<div class="scrim" onclick="document.body.classList.remove('menu')"></div>
<main class="main">
  <header class="top">
    <button class="btn btn-ghost ib" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
    <h1 id="title">Owner Overview</h1>
    <button class="btn btn-ghost ib" id="themeBtn" aria-label="Light or dark mode"><i class="bi bi-circle-half"></i></button>
  </header>
  <div id="view" class="view"></div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* data-loader.js - reads Excel/CSV in the browser, finds the real header row, validates, merges. */
const DL = (() => {
  const iso = v => { if (v == null || v === '') return null;
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    const m = String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
    const d = new Date(v); return isNaN(d) ? null : d.toISOString().slice(0, 10); };
  const num = v => { const n = Number(v); return v == null || v === '' || isNaN(n) ? 0 : n; };
  const str = v => (v == null ? '' : String(v).trim());

  // Finds the header row (disclaimer rows above it are skipped) and returns row objects.
  function table(wb, sheet, req) {
    const ws = wb.Sheets[sheet]; if (!ws) return { missingCols: req };
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    let best = { n: -1 };
    for (let i = 0; i < Math.min(rows.length, 25); i++) {
      const h = (rows[i] || []).map(x => str(x).toLowerCase());
      const hit = req.filter(r => h.includes(r.toLowerCase()));
      if (hit.length === req.length) {
        const keys = rows[i].map(str);
        const data = rows.slice(i + 1).filter(r => r && r.some(c => c != null && c !== '')).map(r => { const o = {}; keys.forEach((k, j) => { if (k) o[k] = r[j]; }); return o; });
        return { headerRow: i + 1, rows: data };
      }
      if (hit.length > best.n) best = { n: hit.length, h: req.filter(r => !hit.includes(r)) };
    }
    return { missingCols: best.h || req };
  }

  const dailyMap = r => ({ d: iso(r.Date), b: str(r.Branch_ID), orders: num(r.Total_Orders), comp: num(r.Completed_Orders), canc: num(r.Cancelled_Orders), units: num(r.Units_Sold), gross: num(r.Gross_Sales), disc: num(r.Discounts), ref: num(r.Refunds), cogs: num(r.COGS) });
  const SPEC = {
    Input_Daily_Orders: { req: ['Date', 'Branch_ID', 'Gross_Sales', 'COGS'], t: 'daily', map: dailyMap },
    Daily_Summary: { req: ['Date', 'Branch_ID', 'Gross_Sales', 'COGS'], t: 'daily', map: dailyMap },
    Input_Product_Monthly: { req: ['Month', 'Product_ID', 'Units_Sold', 'COGS'], t: 'products', map: r => ({ m: iso(r.Month), id: str(r.Product_ID), name: str(r.Product_Name), units: num(r.Units_Sold), rev: num(r.Net_Revenue_After_Refund), cogs: num(r.COGS) }) },
    Product_Cost_Control: { req: ['Product_ID', 'Selling_Price'], t: 'prodCost', map: r => ({ id: str(r.Product_ID), name: str(r.Product_Name), cost: num(r.Ingredient_Cost_Per_Unit) + num(r.Packaging_Cost_Per_Unit) + num(r.Other_Direct_Cost_Per_Unit), price: num(r.Selling_Price) }) },
    Input_Expenses_Monthly: { req: ['Month', 'Branch_ID', 'Salaries', 'Rent'], t: 'expMonthly', map: r => ({ m: iso(r.Month), b: str(r.Branch_ID), sal: num(r.Salaries), rent: num(r.Rent), elec: num(r.Electricity), gas: num(r.Gas), water: num(r.Water), comm: num(r.Delivery_Commissions), mkt: num(r.Marketing), maint: num(r.Repairs_Maintenance), other: num(r.Other_Operating) }) },
    Monthly_Expenses: { req: ['Expense_ID', 'Expense_Date', 'Branch_ID', 'Expense_Category', 'Amount_PKR', 'Payment_Status'], t: 'bills', map: r => ({ id: str(r.Expense_ID), date: iso(r.Expense_Date), m: (iso(r.Expense_Date) || '').slice(0, 7), b: str(r.Branch_ID), cat: str(r.Expense_Category), desc: str(r.Expense_Description), vendor: str(r.Vendor_Name), amt: num(r.Amount_PKR), due: iso(r.Due_Date), status: str(r.Payment_Status), paid: iso(r.Payment_Date) }) },
    Staff_Salaries: { req: ['Employee_ID', 'Branch_ID', 'Monthly_Base_Salary', 'Payroll_Month', 'Payment_Status'], t: 'salaries', map: r => ({ id: str(r.Employee_ID), name: str(r.Employee_Name), b: str(r.Branch_ID), role: str(r.Job_Role), net: num(r.Monthly_Base_Salary) + num(r.Overtime) + num(r.Bonus) - num(r.Deductions), m: (iso(r.Payroll_Month) || '').slice(0, 7), status: str(r.Payment_Status), paid: iso(r.Payment_Date) }) }
  };
  const KEY = { daily: r => r.d + '|' + r.b, products: r => r.m + '|' + r.id, prodCost: r => r.id, expMonthly: r => r.m + '|' + r.b, bills: r => r.id, salaries: r => r.id + '|' + r.m };
  const LABEL = { daily: 'Daily orders & sales', products: 'Product sales by month', prodCost: 'Product prices & costs', expMonthly: 'Monthly expense totals', bills: 'Bills & expenses', salaries: 'Staff salaries' };
  const empty = () => ({ daily: [], products: [], prodCost: [], expMonthly: [], bills: [], salaries: [], settings: null, imports: [] });

  function settings(wb) {
    const ws = wb.Sheets.Owner_Settings; if (!ws) return null;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }); const s = { branches: [] };
    rows.forEach(r => { const k = str(r[0]).toLowerCase(), v = r[1];
      if (k.startsWith('restaurant name')) s.name = str(v).replace(/\s*\(fictional\)/i, '');
      else if (k.startsWith('reporting currency')) s.currency = str(v);
      else if (k.startsWith('reporting start')) s.start = iso(v);
      else if (k.startsWith('reporting end')) s.end = iso(v);
      else if (k.includes('as-of date')) s.asOf = iso(v);
      else if (k.startsWith('target monthly net revenue')) s.targetRev = num(v);
      else if (k.startsWith('target monthly operating profit')) s.targetProfit = num(v); });
    const bt = table(wb, 'Owner_Settings', ['Branch_ID', 'Branch_Name', 'Useful_Life_Months']);
    if (bt.rows) s.branches = bt.rows.filter(r => /^B\d+/.test(str(r.Branch_ID))).map(r => ({ id: str(r.Branch_ID), name: str(r.Branch_Name), city: str(r.City), cost: num(r.Equipment_and_Fitout_Cost_PKR), life: num(r.Useful_Life_Months) }));
    return s;
  }

  // Parse one uploaded file into a preview. Nothing is applied until the owner confirms.
  async function parseFile(file) {
    const res = { name: file.name, sheets: [], parts: {}, errors: [], warnings: [], counts: {}, noMerge: false, branches: [], from: null, to: null };
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); res.sheets = wb.SheetNames;
      for (const [sheet, sp] of Object.entries(SPEC)) {
        if (!wb.Sheets[sheet] || (sheet === 'Daily_Summary' && wb.Sheets.Input_Daily_Orders)) continue;
        const t = table(wb, sheet, sp.req);
        if (t.missingCols) { res.errors.push(`Sheet "${sheet}": missing required column(s): ${t.missingCols.join(', ')}`); continue; }
        let rows = t.rows.map(sp.map); const before = rows.length;
        rows = rows.filter(r => (r.d === undefined || r.d) && (r.m === undefined || r.m) && (r.date === undefined || r.date));
        const k = KEY[sp.t], seen = new Set(); let dup = 0; const uniq = [];
        rows.forEach(r => { const key = k(r); if (seen.has(key)) dup++; else { seen.add(key); uniq.push(r); } });
        if (['bills', 'salaries', 'products', 'prodCost'].includes(sp.t) && uniq.some(r => !r.id)) { res.warnings.push(`"${sheet}" has rows without an ID, so Merge is unsafe. Use Replace.`); res.noMerge = true; }
        if (before > rows.length) res.warnings.push(`"${sheet}": ${before - rows.length} row(s) skipped because a date is missing.`);
        if (dup) res.warnings.push(`"${sheet}": ${dup} duplicate row(s) found and ignored.`);
        res.parts[sp.t] = uniq; res.counts[sp.t] = uniq.length;
      }
      const st = settings(wb); if (st) res.parts.settings = st;
      const dates = [...(res.parts.daily || []).map(r => r.d), ...(res.parts.bills || []).map(r => r.date)].filter(Boolean).sort();
      if (dates.length) { res.from = dates[0]; res.to = dates[dates.length - 1]; }
      res.branches = [...new Set([...(res.parts.daily || []), ...(res.parts.bills || []), ...(res.parts.salaries || [])].map(r => r.b).filter(Boolean))].sort();
      if (!Object.keys(res.parts).length && !res.errors.length) res.errors.push('No known sheets found. Is this one of the FireBite workbooks?');
    } catch (e) { res.errors.push('This file could not be read: ' + e.message); }
    return res;
  }

  function apply(D, previews, mode) {
    const out = JSON.parse(JSON.stringify(D)), rep = [];
    previews.forEach(p => { for (const [t, rows] of Object.entries(p.parts)) {
      if (t === 'settings') { out.settings = Object.assign({}, out.settings || {}, rows); continue; }
      if (mode === 'replace') { rep.push({ t, removed: out[t].length, added: rows.length, updated: 0 }); out[t] = rows.slice(); continue; }

    const r = payRows(S); if (!r.length) return 'No salary records for this period.' + tag; const T = a => a.reduce((z, s) => z + s.net, 0), un = r.filter(s => s.status !== 'Paid'), last = S.p.end.slice(0, 7);

  },
  branches(t, S, { M, P }) {
    const L = branches().map(b => [b, AN.compute(D, b.id, S.p.start, S.p.end)]).filter(z => z[1].hasSales); if (!L.length) return 'No branch data for this period.';
    const key = /margin/.test(t) ? 'margin' : /sale|revenue/.test(t) ? 'net' : /expense/.test(t) ? 'opex' : 'op', S2 = L.slice().sort((a, b) => (b[1][key] ?? -1e18) - (a[1][key] ?? -1e18)), one = z => `<b>${esc(z[0].name)}</b>: sales ${M(z[1].net)}, profit ${M(z[1].op)} (${P(z[1].margin)})`, tag = `<div class="bt">${fd(S.p.start)} to ${fd(S.p.end)}</div>`;
    if (/weak|worst|lowest|least/.test(t)) return 'Weakest: ' + one(S2[S2.length - 1]) + tag; if (/best|top|highest|most/.test(t)) return 'Best: ' + one(S2[0]) + tag;

  reports(t, S, { M, tag }) {

  },

    if (/next|new|add|update|monthly|how/.test(t)) return 'Open Data Import, choose the new Excel file(s), check the preview, pick <b>Merge / Update</b> (keeps old data) and press Confirm. Replace is only for swapping everything.';

  },
  settings(t) {

function bot(q) {

}
function botRender() {

  document.getElementById('ctitle').textContent = PN[pg] + ' assistant'; const ms = document.getElementById('msgs');
  ms.innerHTML = m.map(x => `<div class="m ${x.r}">${x.t}</div>`).join(''); document.getElementById('chips').innerHTML = CHIPS[pg].map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join(''); ms.scrollTop = ms.scrollHeight;
}
function botSend(q) { q = (q || '').trim(); if (!q) return; botRender(); const m = st.chat[st.page]; m.push({ r: 'u', t: esc(q) }); let a; try { a = bot(q); } catch (e) { a = 'Sorry, I could not answer that. ' + esc(e.message); } m.push({ r: 'b', t: a }); botRender(); }
document.body.insertAdjacentHTML('beforeend', '<button id="chatBtn"><i class="bi bi-chat-dots-fill"></i><span>Ask FireBite</span></button><div id="chat"><div class="chh"><div><b id="ctitle"></b><small>Rule-based helper. Answers come from your loaded data.</small></div><button id="chatX" aria-label="Close"><i class="bi bi-x-lg"></i></button></div><div id="msgs"></div><div id="chips"></div><div class="chf"><input id="cin" placeholder="Ask about this page..." autocomplete="off"><button id="csend" aria-label="Send"><i class="bi bi-send-fill"></i></button></div></div>');
document.addEventListener('click', e => { const t = e.target.closest('#chatBtn,#chatX,[data-q],#csend'); if (!t) return; if (t.id === 'chatBtn') { $('#chat').classList.toggle('open'); botRender(); } else if (t.id === 'chatX') $('#chat').classList.remove('open'); else if (t.id === 'csend') { const i = $('#cin'); botSend(i.value); i.value = ''; } else botSend(t.dataset.q); });
